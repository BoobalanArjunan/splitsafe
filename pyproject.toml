[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "splitsafe"
version = "0.1.0"
description = "Check your audio train/validation/test folders for leakage: the same recording (or a re-encoded, trimmed or re-leveled copy) on both sides of a split."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Boobalan Arjunan", email = "boobalan_arjunan@composermind.com" },
]
maintainers = [
  { name = "Boobalan Arjunan", email = "boobalan_arjunan@composermind.com" },
]
keywords = ["audio", "machine-learning", "dataset", "data-leakage", "train-test-split", "deduplication", "fingerprint", "speech", "music"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy", "scipy", "soundfile"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/BoobalanArjunan/splitsafe"
Issues = "https://github.com/BoobalanArjunan/splitsafe/issues"
Source = "https://github.com/BoobalanArjunan/splitsafe"

[project.scripts]
splitsafe = "splitsafe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
